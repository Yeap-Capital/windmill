name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/**"
      - "frontend/**"
      - "chat-sdk/src/**"
      - "docker/**"
      - "system_prompts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "openflow.openapi.yaml"
      - "typescript-client/docs/**"
      - "python-client/docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-image.yml"
      - ".github/workflows/upstream-pr.yml"
      - ".github/automation/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "chat-sdk/src/**"
      - "docker/**"
      - "system_prompts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "openflow.openapi.yaml"
      - "typescript-client/docs/**"
      - "python-client/docs/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/build-image.yml"
      - ".github/workflows/upstream-pr.yml"
      - ".github/automation/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and Workspace tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generate-backend-client
      - run: npm run check
      - name: Workspace regression tests
        run: npx vitest run --project server src/lib/components/sessions/sessionState.test.ts src/lib/workspaceCreation.test.ts

  backend:
    name: Public build and Workspace API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        ports: [5432:5432]
        env:
          POSTGRES_DB: windmill
          POSTGRES_PASSWORD: changeme
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:changeme@localhost:5432/windmill
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "4194304"
      DISABLE_EMBEDDING: "true"
      CREATE_WORKSPACE_REQUIRE_SUPERADMIN: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang mold libclang-dev cmake pkg-config libssl-dev libkrb5-dev libsasl2-dev libcurl4-openssl-dev postgresql-client
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.97.0
          cache-workspaces: backend
          rustflags: "-C link-arg=-fuse-ld=mold"
      - name: Install migration CLI
        run: cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features rustls,postgres
      - name: Prepare live compilation database
        run: cargo sqlx migrate run --source migrations
      - name: Check public backend
        run: cargo check --locked --bin windmill --no-default-features --features quickjs
      - name: Workspace API integration tests
        run: cargo test --locked --no-default-features --features quickjs --test workspace_count_limits --test session_workspace_status -- --nocapture --test-threads=1

