name: Public fork image

on:
  workflow_call:
    inputs:
      upstream_tag:
        type: string
        default: ""
      publish:
        type: boolean
        default: false
      architectures:
        type: string
        default: '["amd64"]'
    outputs:
      image:
        value: ${{ jobs.prepare.outputs.image }}
      tag:
        value: ${{ jobs.prepare.outputs.image_tag }}
      digest:
        value: ${{ jobs.manifest.outputs.digest }}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.source.outputs.image }}
      image_tag: ${{ steps.source.outputs.image_tag }}
      features: ${{ steps.source.outputs.features }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      build_revision: ${{ steps.source.outputs.build_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare source and audit public CE features
        id: source
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python .github/scripts/fork_build.py prepare --tag "$UPSTREAM_TAG" --source "$RUNNER_TEMP/upstream"
      - name: Archive exact build context
        env:
          SOURCE: ${{ steps.source.outputs.source }}
        run: tar -czf "$RUNNER_TEMP/source.tar.gz" -C "$SOURCE" .
      - uses: actions/upload-artifact@v4
        with:
          name: fork-source-${{ github.run_id }}
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: fork-build-metadata
          path: ${{ runner.temp }}/fork-build/
          retention-days: 7
          overwrite: true

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fork-source-${{ github.run_id }}
          path: context
      - name: Unpack source and free runner disk space
        run: |
          mkdir source
          tar -xzf context/source.tar.gz -C source
          rm context/source.tar.gz
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - name: Build unchanged upstream Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}-${{ matrix.arch }}
          build-args: |
            features=${{ needs.prepare.outputs.features }}
            WM_BUILD_VERSION=${{ needs.prepare.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            io.yeap.windmill.fork-revision=${{ github.sha }}
            io.yeap.windmill.build-revision=${{ needs.prepare.outputs.build_revision }}
          cache-from: type=gha,scope=public-ce-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=public-ce-${{ matrix.arch }}
      - name: Start disposable database and patched server
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}-${{ matrix.arch }}
        run: |
          docker run --rm "$IMAGE" windmill --version
          docker network create fork-smoke
          docker run -d --name fork-postgres --network fork-smoke \
            -e POSTGRES_PASSWORD=smoke-test -e POSTGRES_DB=windmill postgres:16
          for attempt in $(seq 1 60); do
            if docker exec fork-postgres pg_isready -U postgres; then break; fi
            sleep 2
          done
          docker exec fork-postgres pg_isready -U postgres
          docker run -d --name fork-server --network fork-smoke \
            -p 127.0.0.1:8000:8000 \
            -e DATABASE_URL=postgres://postgres:smoke-test@fork-postgres:5432/windmill \
            -e MODE=server -e CREATE_WORKSPACE_REQUIRE_SUPERADMIN=true \
            "$IMAGE"
          python control/.github/scripts/smoke_image.py
      - name: Server logs
        if: failure()
        run: docker logs fork-server || true
      - name: Remove smoke-test containers
        if: always()
        run: |
          docker rm -f fork-server fork-postgres || true
          docker network rm fork-smoke || true
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture image
        if: inputs.publish
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}-${{ matrix.arch }}
        run: docker push "$IMAGE"
      - name: Save PR image archive
        if: ${{ !inputs.publish }}
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}-${{ matrix.arch }}
        run: docker save --output "$RUNNER_TEMP/windmill-image.tar" "$IMAGE"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish }}
        with:
          name: windmill-linux-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/windmill-image.tar
          compression-level: 0
          retention-days: 7
          overwrite: true

  manifest:
    if: inputs.publish
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest after every architecture passes
        id: publish
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.image_tag }}
          ARCHITECTURES: ${{ inputs.architectures }}
        run: |
          mapfile -t arches < <(python -c 'import json,os; print("\n".join(json.loads(os.environ["ARCHITECTURES"])))')
          sources=()
          for arch in "${arches[@]}"; do sources+=("$IMAGE-$arch"); done
          docker buildx imagetools create --tag "$IMAGE" "${sources[@]}"
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE" | jq -er .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
