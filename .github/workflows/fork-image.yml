name: Publish public fork image

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Image name and immutable tag
        id: meta
        run: |
          version=$(awk -F '"' '/^version = "/ {print $2; exit}' backend/Cargo.toml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$version-yeap.${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/setup-buildx-action@v3
      - name: Build unchanged upstream Dockerfile with public CE features
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}
          build-args: |
            features=oss_core,operator,all_languages,jemalloc,dind,agent_worker_server
            WM_BUILD_VERSION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=public-ce-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=public-ce-${{ matrix.arch }}
      - name: Test image against a disposable database
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}
        run: |
          docker run --rm "$IMAGE" windmill --version
          docker network create fork-smoke
          docker run -d --name fork-postgres --network fork-smoke \
            -e POSTGRES_PASSWORD=smoke-test -e POSTGRES_DB=windmill postgres:16
          for attempt in $(seq 1 60); do
            if docker exec fork-postgres pg_isready -U postgres; then break; fi
            sleep 2
          done
          docker exec fork-postgres pg_isready -U postgres
          docker run -d --name fork-server --network fork-smoke \
            -p 127.0.0.1:8000:8000 \
            -e DATABASE_URL=postgres://postgres:smoke-test@fork-postgres:5432/windmill \
            -e MODE=server -e CREATE_WORKSPACE_REQUIRE_SUPERADMIN=true "$IMAGE"
          python .github/scripts/smoke_image.py
      - name: Server logs
        if: failure()
        run: docker logs fork-server || true
      - name: Remove test containers
        if: always()
        run: |
          docker rm -f fork-server fork-postgres || true
          docker network rm fork-smoke || true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${{ matrix.arch }}
        run: docker push "$IMAGE"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish manifest after both architectures pass
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
        run: |
          docker buildx imagetools create --tag "$IMAGE" "$IMAGE-amd64" "$IMAGE-arm64"
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMAGE" | jq -er .digest)
          echo "Published $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
