name: Open upstream release upgrade PR

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Stable upstream release, e.g. v1.856.0; empty selects latest"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-upstream-release
  cancel-in-progress: false

jobs:
  upgrade:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure GitHub git authentication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
      - name: Rebase main changes onto the release and open an upgrade PR
        id: upgrade
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_RELEASE_TOKEN: ${{ secrets.UPSTREAM_RELEASE_TOKEN }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: python .github/scripts/fork_build.py upgrade --tag "$UPSTREAM_TAG" --source "$RUNNER_TEMP/upgrade"
      - name: Run tests explicitly for the bot-created PR
        if: steps.upgrade.outputs.test_branch != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.upgrade.outputs.test_branch }}
        run: gh workflow run fork-ci.yml --ref "$BRANCH"
      - name: Report upgrade PR
        env:
          PR_URL: ${{ steps.upgrade.outputs.pr_url }}
          REASON: ${{ steps.upgrade.outputs.reason }}
        run: echo "${PR_URL:-$REASON}" >> "$GITHUB_STEP_SUMMARY"
